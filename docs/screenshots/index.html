<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KY DNSPup 全页面截图</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#27364c;font:15px/1.6 system-ui,sans-serif}header{padding:20px 28px;background:white;border-bottom:1px solid #d6dfeb}h1{font-size:23px;margin:0 0 5px}p{margin:4px 0;color:#64748b}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}select,button,a.view{padding:8px 12px;border:1px solid #cdd7e5;background:white;border-radius:5px;color:#234ea8;font:inherit}button[aria-pressed=true]{background:#417bf5;color:white}main{padding:20px;display:flex;justify-content:center}img{display:block;width:100%;max-width:1280px;height:auto;box-shadow:0 4px 18px #24365320}img.mobile{max-width:390px}a{color:#234ea8}</style><header><h1>KY DNSPup 全页面截图</h1><p>24 个页面 · 48 张完整截图 · 本地演示数据，非线上实测</p><p>管理端没有用户名或默认密码。首次安装访问 /admin 自设密码；公网安装另需初始化令牌。</p><div class="bar"><label>页面 <select id="page"><optgroup label="前台"><option value="public-home">首页</option><option value="public-ping">在线 Ping</option><option value="public-tcping">在线 TCPing</option><option value="public-http">网站测速</option><option value="public-dns">DNS 查询</option><option value="public-traceroute">路由追踪</option><option value="public-mtr">MTR</option><option value="public-ping_ipv6">IPv6 Ping</option><option value="public-tcping_ipv6">IPv6 TCPing</option><option value="public-http_ipv6">IPv6 网站测速</option><option value="public-traceroute_ipv6">IPv6 路由追踪</option><option value="public-mtr_ipv6">IPv6 MTR</option><option value="public-help">使用帮助</option><option value="public-privacy">服务与隐私</option></optgroup><optgroup label="管理端"><option value="admin-setup">首次创建管理员</option><option value="admin-login">管理员登录</option><option value="admin-overview">站点概览</option><option value="admin-site">站点设置</option><option value="admin-api">节点 API</option><option value="admin-nodes">工具与节点</option><option value="admin-limits">访问限制</option><option value="admin-ads">广告与链接</option><option value="admin-logs">调用记录</option><option value="admin-backup">备份与安全</option></optgroup></select></label><button data-device="desktop" aria-pressed="true">桌面</button><button data-device="mobile" aria-pressed="false">手机</button><a class="view" id="original" target="_blank">查看原图</a><a href="README.md">截图说明</a></div></header><main><img id="preview" alt="页面截图"></main><script>const picker=document.querySelector('#page'),img=document.querySelector('#preview'),link=document.querySelector('#original');let device='desktop';function show(){img.src=picker.value+'-'+device+'.png';img.className=device;img.alt=picker.selectedOptions[0].text+' '+(device==='desktop'?'桌面':'手机');link.href=img.src;document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device)))}picker.addEventListener('change',show);document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{device=b.dataset.device;show()}));show();</script></html>
